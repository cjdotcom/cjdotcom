name: terminal

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, ~00:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/terminal.py
      - .github/workflows/terminal.yml

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gerar terminal
        run: python3 scripts/terminal.py
        env:
          # Opcional: crie o secret TERMINAL_TOKEN (PAT clássico com read:user + repo)
          # para contar contribuições privadas. Sem ele, usa o token padrão (só dados públicos).
          GITHUB_TOKEN: ${{ secrets.TERMINAL_TOKEN || github.token }}

      - name: Commit se mudou
        run: |
          git add assets README.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza terminal"
          git push
